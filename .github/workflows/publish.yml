# Reference: https://docs.npmjs.com/trusted-publishers
name: Publish Package to npm
on:
  release:
    types: [published]
jobs:
  build:
    # Only package releases. This repository also publishes `companion-*`
    # releases for the prebuilt idb_companion, which are keyed to the pinned idb
    # sha rather than to a package version -- there are several of them per
    # package version, and none of them is a thing to publish to npm. Without
    # this filter, bumping the idb submodule publishes the package.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci

      # Install the package the way a user does and start it, because the
      # repository is not a realistic environment: devDependencies are present
      # there, so a runtime import that is only a transitive devDependency
      # resolves locally and fails for everyone else.
      #
      # 2.0.0 shipped exactly that. The generated gRPC client imports
      # `@bufbuild/protobuf/wire`, which was reachable in the repo only through
      # ts-proto, a devDependency. Every check passed -- it built, it packed
      # with the right files, it ran from the working tree -- and the published
      # package could not start at all.
      - name: Smoke test the packed package
        run: |
          set -euo pipefail
          TGZ="$(npm pack --silent | tail -1)"
          WORK="$(mktemp -d)"
          cp "$TGZ" "$WORK/"
          cd "$WORK"
          npm init -y >/dev/null
          npm install "./$TGZ" --no-audit --no-fund >/dev/null

          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}'
          RESPONSE="$(printf '%s\n' "$INIT" \
            | node node_modules/ios-multi-simulator-mcp/build/index.js --stdio 2>&1 || true)"
          echo "$RESPONSE" | head -c 400
          echo
          if ! grep -q '"serverInfo"' <<<"$RESPONSE"; then
            echo "::error::The packed package did not answer an MCP initialize. It is not installable; refusing to publish."
            exit 1
          fi
          echo "::notice::Packed package installs and answers initialize."

      - run: npm publish --access public
